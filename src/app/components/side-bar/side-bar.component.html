<div class="side-bar" [ngClass]="{ 'open': isOpen, 'closed': !isOpen }">
    <div class="side-bar-topo">
        <h2 *ngIf="isOpen">SysControl</h2>
        <button (click)="toggleSidebarVisibility()">
            <span translate="no" class="material-symbols-outlined">
                {{ isOpen ? 'right_panel_close' : 'right_panel_open' }}
            </span>
        </button>
    </div>
    <div class="side-bar-itens">
        <ul>
            <li routerLink="/dashboard" routerLinkActive="isSelected">
                <span translate="no" class="material-symbols-outlined">analytics</span>
                <p *ngIf="isOpen">Dashboards</p>
            </li>
            <li routerLink="/gerenciar" routerLinkActive="isSelected"><span translate="no" class="material-symbols-outlined">compare_arrows</span>
                <p *ngIf="isOpen">Gerenciar</p>
            </li>
            <li routerLink="/produto" routerLinkActive="isSelected">
                <span translate="no" class="material-symbols-outlined">splitscreen_add</span>
                <p *ngIf="isOpen">Cadastrar Produtos</p>
            </li>
            <li routerLink="/categoria" routerLinkActive="isSelected">
                <span translate="no" class="material-symbols-outlined">category</span>
                <p *ngIf="isOpen">Cadastrar Categoria</p>
            </li>
            <li routerLink="/login">
                <span translate="no" class="material-symbols-outlined">logout</span>
                <p *ngIf="isOpen">Sair</p>
            </li>
        </ul>
    </div>
</div>
